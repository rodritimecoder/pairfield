name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Do not publish a binary unless the DSP invariants and the impulse-response
  # spec still hold. This is the same gate that was used locally.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: verify

      - name: DSP invariants
        run: cargo test --release

      - name: Impulse-response spec
        run: cargo run --release --example measure

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            bundler: bundle
          - os: macos-latest
            name: macos-universal
            bundler: bundle-universal
          - os: windows-latest
            name: windows-x86_64
            bundler: bundle

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS cross targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install the nice-plug bundler
        run: cargo install cargo-nice-plug

      - name: Build VST3 + CLAP bundles
        run: cargo nice-plug ${{ matrix.bundler }} pairfield --release

      # Relative output path on purpose: GNU tar treats the `D:` of a Windows
      # absolute path as a remote host ("Cannot connect to D:").
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/pairfield-${{ matrix.name }}.tar.gz" -C target/bundled .
          ls -lh dist
          tar -tzf "dist/pairfield-${{ matrix.name }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: pairfield-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [verify, build]
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what will be published
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
          body: |
            Pairfield — binaural crossfeed and virtual-monitor stage for open-back headphones.

            | platform | contains |
            |---|---|
            | `linux-x86_64` | `pairfield.vst3` (bundle) + `pairfield.clap` |
            | `macos-universal` | `pairfield.vst3` (arm64 + x86_64) + `pairfield.clap` |
            | `windows-x86_64` | `pairfield.vst3` (bundle) + `pairfield.clap` |

            Install: unpack into `~/.vst3` / `~/.clap` (Linux), `~/Library/Audio/Plug-Ins/VST3` /
            `~/Library/Audio/Plug-Ins/CLAP` (macOS), or
            `%COMMONPROGRAMFILES%\VST3` / `%LOCALAPPDATA%\Programs\Common\CLAP` (Windows).

            Every claim in [ARCHITECTURE.md](ARCHITECTURE.md) is checked by
            `cargo run --release --example measure` before this release was built.
